services:
  webui:
    image: 100225593120.dkr.ecr.us-east-1.amazonaws.com/agr_pavi/webui:${PAVI_IMAGE_TAG:-dev}
    ports:
      - "3000:3000"
    environment:
      - PAVI_API_BASE_URL=http://api:8080
      - NODE_ENV=production
    restart: always
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api:
    image: 100225593120.dkr.ecr.us-east-1.amazonaws.com/agr_pavi/api:${PAVI_IMAGE_TAG:-main}
    ports:
      - "8080:8080"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - API_EXECUTION_ENV=aws
      - PAVI_ENVIRONMENT=${PAVI_ENVIRONMENT:-dev}
      - API_PIPELINE_IMAGE_TAG=${PAVI_IMAGE_TAG:-main}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
